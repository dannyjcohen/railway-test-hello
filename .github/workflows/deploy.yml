name: Deploy to Railway
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy to Railway
        env:
          # Railway CLI uses RAILWAY_API_TOKEN for auth (account-scoped token).
          # RAILWAY_PROJECT_ID + RAILWAY_ENVIRONMENT_ID replace the need for `railway link`.
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: npx -y @railway/cli up --service ${{ secrets.RAILWAY_SERVICE_ID }} --detach
